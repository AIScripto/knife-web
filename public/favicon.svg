<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Background -->
  <rect width="64" height="64" rx="14" fill="#13141a" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" stroke="#d97706" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Forge Glow -->
  <circle cx="32" cy="32" r="22" fill="#d97706" fill-opacity="0.15" />

  <!-- Damascus Blade (Angled 45 degrees) -->
  <g transform="rotate(-45 32 32)">
    <!-- Blade Point & Edge -->
    <path d="M32 8 C32 8 38 18 38 34 L26 34 C26 18 32 8 32 8 Z" fill="url(#blade_grad)" stroke="#f8fafc" stroke-width="1" />
    
    <!-- Damascus Water Layers -->
    <path d="M28 16 Q32 18 36 16" stroke="#94a3b8" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M27 21 Q32 24 37 21" stroke="#94a3b8" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M27 26 Q32 29 37 26" stroke="#94a3b8" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M26.5 30 Q32 33 37.5 30" stroke="#94a3b8" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Bolster / Brass Guard -->
    <rect x="23" y="34" width="18" height="4" rx="1.5" fill="url(#brass_grad)" stroke="#78350f" stroke-width="0.8" />

    <!-- Handle (Stag / Hardwood) -->
    <path d="M26 38 L38 38 L36 56 L28 56 Z" fill="url(#handle_grad)" stroke="#451a03" stroke-width="1" />

    <!-- Handle Pins -->
    <circle cx="32" cy="43" r="1.5" fill="#fef3c7" stroke="#92400e" stroke-width="0.5" />
    <circle cx="32" cy="50" r="1.5" fill="#fef3c7" stroke="#92400e" stroke-width="0.5" />

    <!-- Pommel -->
    <path d="M27 56 L37 56 L35 59 L29 59 Z" fill="url(#brass_grad)" />
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="blade_grad" x1="26" y1="8" x2="38" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="brass_grad" x1="23" y1="34" x2="41" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="handle_grad" x1="26" y1="38" x2="38" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
  </defs>
</svg>
